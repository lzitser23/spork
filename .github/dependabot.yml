version: 2
updates:
  # Frontend (Vite/React) dependencies. The self-updater's TLS/hashing path
  # raises the stakes for an unsurfaced advisory, so keep these current.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Tauri backend crates — reqwest + sha2 drive the update download/verify path.
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Keep the CI/build workflow actions patched too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
